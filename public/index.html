<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reliable UDP Console</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">FULL-STACK NETWORKING DEMO</p>
      <h1>Reliable UDP Console</h1>
      <p class="intro">Send browser messages through WebSocket, Node.js, and a custom reliable UDP transport.</p>
      <section class="panel">
        <div id="status" class="status">Connecting…</div>
        <form id="message-form">
          <label for="message">Message</label>
          <textarea id="message" maxlength="65536" required placeholder="Type a message to send reliably"></textarea>
          <button type="submit">Send over UDP</button>
        </form>
        <div id="events" class="events" aria-live="polite"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
